<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Data Search Dashboard</title>

  <link rel="icon" type="image/png" href="https://i.postimg.cc/hj1XhRPQ/Screenshot-2026-11-05-114721.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f7fb;
      color:#1f2937;
    }

    body{padding:10px}

    .container{
      width:100%;
      max-width:1700px;
      margin:0 auto;
    }

    /* =========================
       COMPACT HEADER (MATCH ORIGINAL 2-COL ROW 1)
       ========================= */
    .header-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:10px;
    }

    .header-card{
      width:100%;
      height:78px;
      min-height:78px;
      background:#fff;
      border:1px solid #e3e9f2;
      border-radius:16px;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
    }

    /* SEARCH */
    .search-card{
      display:flex;
      align-items:center;
      padding:10px 18px;
      gap:16px;
    }

    .brand-icon{
      width:44px;
      height:44px;
      min-width:44px;
      border-radius:12px;
      background:#ffe4e4;
      color:#ff1111;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
    }

    .brand-text{
      min-width:245px;
      line-height:1.15;
    }

    .brand-title{
      font-size:18px;
      font-weight:700;
      color:#172033;
      white-space:nowrap;
    }

    .brand-subtitle{
      margin-top:5px;
      font-size:12px;
      color:#7b8798;
      white-space:nowrap;
    }

    .search-area{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
      width:52%;
    }

    .search-input{
      width:100%;
      height:42px;
      border:2px solid #d8e0eb;
      outline:none;
      border-radius:10px;
      padding:0 14px;
      font-size:14px;
      color:#24344d;
      background:#fff;
    }

    .search-input:focus{
      border-color:#ff3b3b;
      box-shadow:0 0 0 3px rgba(255,0,0,.08);
    }

    .search-button{
      height:42px;
      min-width:108px;
      padding:0 16px;
      border:none;
      border-radius:10px;
      background:#ff0505;
      color:#fff;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
      white-space:nowrap;
    }

    .search-button:hover{
      background:#e60000;
      transform:translateY(-1px);
    }

    /* CUSTOMER */
    .customer-card{
      display:flex;
      align-items:center;
      padding:10px 20px;
    }

    .customer-icon{
      width:44px;
      height:44px;
      min-width:44px;
      border-radius:50%;
      background:#edf4ff;
      color:#2563eb;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:19px;
      margin-right:14px;
    }

    .customer-name{
      font-size:18px;
      font-weight:700;
      color:#172033;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .customer-code{
      margin-top:4px;
      font-size:12px;
      color:#718096;
    }

    /* SECOND ROW */
    .second-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:10px;
    }

    .config-section{
      height:78px;
      min-height:78px;
      background:#fff;
      border:1px solid #e3e9f2;
      border-radius:16px;
      padding:8px 14px;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
      overflow:hidden;
    }

    .config-title{
      height:10px;
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
      font-size:12px;
      font-weight:700;
      color:#24344d;
    }

    .config-title i{color:#ff1111;font-size:10px}

    .config-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }

    .config-box{
      height:42px;
      border:1px solid #dfe7f1;
      background:#f8fafc;
      border-radius:10px;
      padding:0 10px;
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .config-box:nth-child(1) i{color:#ff1111}
    .config-box:nth-child(2) i{color:#2563eb}
    .config-box:nth-child(3) i{color:#16a34a}

    .config-icon{
      width:26px;
      height:26px;
      min-width:26px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      font-size:18px;
    }

    .config-info{
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      line-height:1.05;
    }

    .config-label{
      font-size:12px;
      color:#6b7280;
      white-space:nowrap;
    }

    .config-value{
      margin-top:3px;
      font-size:18px;
      font-weight:700;
      color:#536174;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* SALES / SUPPORT */
    .people-card{
      height:78px;
      min-height:78px;
      background:#fff;
      border:1px solid #e3e9f2;
      border-radius:16px;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
      display:grid;
      grid-template-columns:1fr 1fr;
      overflow:hidden;
    }

    .person{
      display:flex;
      align-items:center;
      padding:8px 22px;
      min-width:0;
    }

    .person + .person{
      border-left:1px solid #e5eaf1;
    }

    .person-icon{
      width:42px;
      height:42px;
      min-width:42px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-right:13px;
      font-size:17px;
    }

    .sales-icon{
      background:#f4eaff;
      color:#7024bd;
    }

    .support-icon{
      background:#e9fbf1;
      color:#009b69;
    }

    .person-info{min-width:0}

    .person-name{
      font-size:14px;
      font-weight:700;
      color:#172033;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .person-role{
      margin-top:2px;
      font-size:10px;
      color:#718096;
      white-space:nowrap;
    }

    /* ERROR */
    #errorBox{
      display:none;
      width:100%;
      background:#fee2e2;
      color:#991b1b;
      border:1px solid #fecaca;
      border-radius:10px;
      padding:8px 12px;
      font-size:13px;
      font-weight:600;
      margin-bottom:10px;
    }

    /* =========================
       RESULT CARDS
       ========================= */
    .result-grid{
      display:grid;
      width:100%;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
    }

    .result-card{
      width:100%;
      min-height:280px;
      background:#fff;
      border-radius:16px;
      border:1px solid #e1e7ef;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
      overflow:hidden;
    }

    .result-header{
      width:100%;
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:7px 10px;
      color:#fff;
      font-size:15px;
      font-weight:700;
      text-align:center;
    }

    .result-header i{
      margin-right:8px;
      font-size:14px;
    }

    .result-card:nth-child(1) .result-header{background:#ff0808}
    .result-card:nth-child(2) .result-header{background:#24428f}
    .result-card:nth-child(3) .result-header{background:#8122ce}
    .result-card:nth-child(4) .result-header{background:#079b70}

    .result-body{
      width:100%;
      padding:28px 20px;
      text-align:left;
      font-size:16px;
      line-height:1.65;
      color:#172d4d;
      white-space:pre-wrap;
      word-break:break-word;
    }

    /* =========================
       RESPONSIVE
       ========================= */
    @media(max-width:1100px){
      .brand-text{min-width:190px}
      .search-area{width:48%}
      .result-grid{gap:10px}
      .result-body{font-size:15px}
    }

    @media(max-width:850px){
      .header-grid,
      .second-grid{
        grid-template-columns:1fr;
      }

      .header-card,
      .config-section,
      .people-card{
        height:auto;
        min-height:78px;
      }

      .search-card{min-height:78px}
      .search-area{width:45%}

      .result-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:600px){
      body{padding:7px}

      .search-card{
        flex-wrap:wrap;
        height:auto;
        padding:10px;
      }

      .brand-text{
        min-width:0;
        flex:1;
      }

      .brand-title{font-size:16px}
      .brand-subtitle{font-size:11px}

      .search-area{
        width:100%;
        margin-left:0;
      }

      .config-grid{
        grid-template-columns:1fr;
      }

      .config-section{
        height:auto;
        padding-bottom:10px;
      }

      .people-card{
        grid-template-columns:1fr;
      }

      .person{
        padding:10px 15px;
      }

      .person + .person{
        border-left:none;
        border-top:1px solid #e5eaf1;
      }

      .result-grid{
        grid-template-columns:1fr;
      }

      .result-card{min-height:180px}
    }

    /* =========================
       CUSTOMER DROPDOWN (ADD-ON)
       ========================= */
    .search-area .search-input{
      flex:0 0 140px !important;
      min-width:0;
      width:140px !important;
    }

    /* ช่องค้นหาพอดีเนื้อหา + ให้กล่องซ้ายแถว 1 กับแถว 2 กว้างเท่ากัน */
    .search-card .search-area{width:auto;flex:0 0 auto}
    .search-card .search-button,
    .search-card .cust-dd{flex:0 0 auto}

    /* ให้ส่วนชื่อระบบหดได้ ปุ่มค้นหาจะไม่ตกขอบ */
    .search-card .brand-text{
      flex:1 1 auto;
      min-width:0;
      overflow:hidden;
    }
    .search-card .brand-title,
    .search-card .brand-subtitle{
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .search-card .brand-title{font-size:15px}
    .search-card .brand-subtitle{font-size:10px}

    @media(min-width:851px){
      .header-grid,
      .second-grid{
        grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      }
    }

    @media(max-width:600px){
      .search-card .brand-title{font-size:14px}
      .search-card .brand-subtitle{font-size:9.5px}
      .search-card .search-area{width:100%;flex:1 1 100%}
      .search-area .search-input{flex:1 1 auto !important;width:auto !important}
    }

    .cust-dd{
      position:relative;
      flex:0 0 auto;
    }

    .dd-toggle{
      width:42px;
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:0;
      border:2px solid #d8e0eb;
      border-radius:10px;
      background:#fff;
      color:#24344d;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:.2s;
    }

    .dd-toggle:hover,
    .cust-dd.open .dd-toggle{
      border-color:#ff3b3b;
      box-shadow:0 0 0 3px rgba(255,0,0,.08);
    }

    .dd-toggle i{
      font-size:11px;
      color:#6b7280;
      transition:transform .2s;
    }

    .cust-dd.open .dd-toggle i{transform:rotate(180deg)}

    .dd-panel{
      display:none;
      position:absolute;
      top:46px;
      right:0;
      left:auto;
      z-index:999;
      width:440px;
      max-width:90vw;
      max-height:260px;
      overflow-y:auto;
      background:#fff;
      border:1px solid #cfd8e6;
      border-radius:10px;
      box-shadow:0 8px 24px rgba(0,0,0,.15);
    }

    .cust-dd.open .dd-panel{display:block}

    .dd-item{
      display:grid;
      grid-template-columns:100px 1fr;
      align-items:center;
      padding:7px 12px;
      font-size:13px;
      color:#172033;
      cursor:pointer;
      border-bottom:1px solid #f0f3f8;
    }

    .dd-item:last-child{border-bottom:none}

    .dd-item:hover{
      background:#ffeaea;
    }

    .dd-code{
      font-weight:700;
      color:#24344d;
    }

    .dd-name{
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .dd-empty{
      padding:12px;
      font-size:13px;
      color:#7b8798;
      text-align:center;
    }

  </style>
</head>

<body>
<div class="container">

  <!-- =========================
       ROW 1 (Exact 2-Column Header Layout)
       ========================= -->
  <div class="header-grid">

    <!-- SEARCH -->
    <div class="header-card search-card">
      <div class="brand-icon">
        <i class="fa-solid fa-file-invoice"></i>
      </div>

      <div class="brand-text">
        <div class="brand-title">ระบบค้นหาเงื่อนไขเอกสาร</div>
        <div class="brand-subtitle">ค้นหาและตรวจสอบเงื่อนไขการออกเอกสาร</div>
      </div>

      <div class="search-area">

        <input
          type="text"
          id="custCodeInput"
          class="search-input"
          placeholder="กรอกรหัสลูกค้า"
          autocomplete="off">

        <!-- ===== ADD: DROPDOWN (ปุ่มอยู่ระหว่างช่องกรอกกับปุ่มค้นหา) ===== -->
        <div class="cust-dd" id="custDd">
          <button type="button" class="dd-toggle" id="ddToggle" title="เลือกลูกค้า">
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="dd-panel" id="ddPanel">
            <div class="dd-empty">กำลังโหลดรายการ...</div>
          </div>
        </div>
        <!-- ===== END ADD ===== -->

        <button class="search-button" onclick="runSearch()">
          <i class="fa-solid fa-magnifying-glass"></i>
          &nbsp;ค้นหา
        </button>
      </div>
    </div>

    <!-- CUSTOMER -->
    <div class="header-card customer-card">
      <div class="customer-icon">
        <i class="fa-solid fa-building"></i>
      </div>

      <div>
        <div id="txtCustName" class="customer-name">-</div>
        <div class="customer-code">
          Customer Code : <span id="txtCustCode">-</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ERROR -->
  <div id="errorBox"></div>

  <!-- =========================
       ROW 2
       ========================= -->
  <div class="second-grid">

    <!-- DOCUMENT INFORMATION -->
    <div class="config-section">
      <div class="config-title">
        <i class="fa-solid fa-folder-open"></i>
        ข้อมูลการออกเอกสาร
      </div>

      <div class="config-grid">

        <div class="config-box">
          <div class="config-icon">
            <i class="fa-solid fa-file-lines"></i>
          </div>
          <div class="config-info">
            <span class="config-label">Doc. Type</span>
            <span id="selDocType" class="config-value">-</span>
          </div>
        </div>

        <div class="config-box">
          <div class="config-icon">
            <i class="fa-regular fa-copy"></i>
          </div>
          <div class="config-info">
            <span class="config-label">Copies</span>
            <span id="selCopies" class="config-value">-</span>
          </div>
        </div>

        <div class="config-box">
          <div class="config-icon">
            <i class="fa-solid fa-right-left"></i>
          </div>
          <div class="config-info">
            <span class="config-label">Doc. Return</span>
            <span id="selDocReturn" class="config-value">-</span>
          </div>
        </div>

      </div>
    </div>

    <!-- SALES / SUPPORT -->
    <div class="people-card">

      <div class="person">
        <div class="person-icon sales-icon">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="person-info">
          <div id="txtSalesName" class="person-name">-</div>
          <div class="person-role">Sales Incharge</div>
        </div>
      </div>

      <div class="person">
        <div class="person-icon support-icon">
          <i class="fa-solid fa-headset"></i>
        </div>
        <div class="person-info">
          <div id="txtSaleSupport" class="person-name">-</div>
          <div class="person-role">Sale Support</div>
        </div>
      </div>

    </div>

  </div>

  <!-- =========================
       RESULT CARDS (Always visible like original UI)
       ========================= -->
  <div id="resultGrid" class="result-grid">

    <div class="result-card">
      <div class="result-header">
        <i class="fa-solid fa-gavel"></i>
        Invoice Conditions
      </div>
      <div id="boxConditions" class="result-body">-</div>
    </div>

    <div class="result-card">
      <div class="result-header">
        <i class="fa-solid fa-paperclip"></i>
        Document Attached
      </div>
      <div id="boxDocument" class="result-body">-</div>
    </div>

    <div class="result-card">
      <div class="result-header">
        <i class="fa-solid fa-comment-dots"></i>
        Remark
      </div>
      <div id="boxRemark" class="result-body">-</div>
    </div>

    <div class="result-card">
      <div class="result-header">
        <i class="fa-solid fa-file-invoice-dollar"></i>
        Billing PO
      </div>
      <div id="boxBilling" class="result-body">-</div>
    </div>

  </div>
</div>

<script>
  /* =========================================================
     SUPABASE CONFIGURATION
     ========================================================= */
  const SUPABASE_URL = 'https://tnellcczognzzjkwtsbf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_1qt2jx7-2aN-bjfbFr1C9g_BxwOU4jG';
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* =========================================================
     SEARCH
     ========================================================= */
  async function runSearch() {
    var custCodeInput = document.getElementById('custCodeInput');
    var custCode = custCodeInput.value.trim();
    var errorBox = document.getElementById('errorBox');

    errorBox.style.display = 'none';
    errorBox.textContent = '';

    if (!custCode) {
      errorBox.textContent = 'กรุณากรอกรหัสลูกค้า';
      errorBox.style.background = '#fee2e2';
      errorBox.style.color = '#991b1b';
      errorBox.style.borderColor = '#fecaca';
      errorBox.style.display = 'block';
      return;
    }

    errorBox.style.display = 'block';
    errorBox.style.background = '#eff6ff';
    errorBox.style.color = '#1d4ed8';
    errorBox.style.borderColor = '#bfdbfe';
    errorBox.textContent = 'กำลังค้นหาข้อมูล...';

    const searchCode = custCode.toUpperCase();

    try {
      const { data, error } = await sbClient
        .from('invoice_conditions')
        .select('*')
        .eq('customer_code', searchCode)
        .maybeSingle();

      errorBox.style.display = 'none';
      errorBox.style.background = '';
      errorBox.style.color = '';
      errorBox.style.borderColor = '';

      if (error) {
        console.error('Database Error:', error.message);
        errorBox.textContent = 'เกิดข้อผิดพลาดในการดึงข้อมูล: ' + error.message;
        errorBox.style.background = '#fee2e2';
        errorBox.style.color = '#991b1b';
        errorBox.style.borderColor = '#fecaca';
        errorBox.style.display = 'block';
        return;
      }

      if (!data) {
        errorBox.textContent = 'ไม่พบข้อมูลรหัสลูกค้า ' + searchCode;
        errorBox.style.background = '#fee2e2';
        errorBox.style.color = '#991b1b';
        errorBox.style.borderColor = '#fecaca';
        errorBox.style.display = 'block';
        return;
      }

      /* CUSTOMER */
      document.getElementById('txtCustName').textContent = data.customer_name || '-';
      document.getElementById('txtCustCode').textContent = data.customer_code || '-';

      /* SALES */
      document.getElementById('txtSalesName').textContent = data.sales_incharge || '-';

      /* DOCUMENT INFORMATION */
      document.getElementById('selDocType').textContent = data.doc_type || '-';
      document.getElementById('selCopies').textContent = data.copies || '-';
      document.getElementById('selDocReturn').textContent = data.doc_return || '-';

      /* SALE SUPPORT */
      document.getElementById('txtSaleSupport').textContent = data.sale_support || '-';

      /* RESULT CARDS */
      document.getElementById('boxConditions').textContent = data.invoice_conditions || '-';
      document.getElementById('boxDocument').textContent = data.document_attached || '-';
      document.getElementById('boxRemark').textContent = data.remark || '-';
      document.getElementById('boxBilling').textContent = data.billing_po || '-';

    } catch (err) {
      console.error('Network Error:', err);
      errorBox.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message;
      errorBox.style.background = '#fee2e2';
      errorBox.style.color = '#991b1b';
      errorBox.style.borderColor = '#fecaca';
      errorBox.style.display = 'block';
    }
  }

  /* =========================================================
     ENTER KEY
     ========================================================= */
  document.getElementById('custCodeInput').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      runSearch();
    }
  });

  /* =========================================================
     CUSTOMER DROPDOWN (ADD-ON)
     ========================================================= */
  (function () {
    var dd      = document.getElementById('custDd');
    var toggle  = document.getElementById('ddToggle');
    var panel   = document.getElementById('ddPanel');
    var input   = document.getElementById('custCodeInput');

    /* เปิด/ปิดรายการ */
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      dd.classList.toggle('open');
    });

    /* คลิกนอกกล่องแล้วปิด */
    document.addEventListener('click', function (e) {
      if (!dd.contains(e.target)) dd.classList.remove('open');
    });

    /* เลือกรายการ */
    function selectCustomer(code) {
      input.value = code;
      dd.classList.remove('open');
      runSearch();
    }

    /* สร้างรายการ */
    function renderList(rows) {
      panel.innerHTML = '';
      if (!rows.length) {
        var empty = document.createElement('div');
        empty.className = 'dd-empty';
        empty.textContent = 'ไม่พบรายการ';
        panel.appendChild(empty);
        return;
      }
      rows.forEach(function (r) {
        var item = document.createElement('div');
        item.className = 'dd-item';

        var c = document.createElement('div');
        c.className = 'dd-code';
        c.textContent = r.customer_code || '';

        var n = document.createElement('div');
        n.className = 'dd-name';
        n.textContent = r.customer_name || '';
        n.title = r.customer_name || '';

        item.appendChild(c);
        item.appendChild(n);
        item.addEventListener('click', function () {
          selectCustomer(r.customer_code);
        });
        panel.appendChild(item);
      });
    }

    /* โหลดรายชื่อลูกค้าจาก Supabase (รองรับเกิน 1,000 แถว) */
    async function loadCustomerList() {
      var all = [];
      var from = 0;
      var size = 1000;
      try {
        while (true) {
          var res = await sbClient
            .from('invoice_conditions')
            .select('customer_code, customer_name')
            .order('customer_code', { ascending: true })
            .range(from, from + size - 1);

          if (res.error) throw res.error;
          all = all.concat(res.data || []);
          if (!res.data || res.data.length < size) break;
          from += size;
        }
        renderList(all);
      } catch (err) {
        console.error('Dropdown Error:', err);
        panel.innerHTML = '<div class="dd-empty">โหลดรายการไม่สำเร็จ</div>';
      }
    }

    loadCustomerList();
  })();
</script>

</body>
</html>
