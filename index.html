<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหาเงื่อนไขเอกสาร - Invoice Data Search Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header & Search Box -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-red-50 p-3 rounded-xl text-red-600 font-bold">📄</div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">ระบบค้นหาเงื่อนไขเอกสาร</h1>
                    <p class="text-xs text-slate-500">ค้นหาและตรวจสอบเงื่อนไขการออกเอกสาร</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 w-full md:w-auto">
                <input type="text" id="searchInput" placeholder="พิมพ์รหัสลูกค้า เช่น TH0032" class="px-4 py-2 border border-slate-200 rounded-xl outline-none focus:border-red-500 w-full md:w-64" onkeypress="if(event.key === 'Enter') handleSearch()">
                <button onclick="handleSearch()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-xl font-medium transition flex items-center gap-1 cursor-pointer">
                    🔍 ค้นหา
                </button>
            </div>
        </div>

        <!-- Customer Info Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <h2 id="customerName" class="text-lg font-bold text-slate-800">-</h2>
                    <p class="text-xs text-slate-400">Customer Code : <span id="displayCode">-</span></p>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm">
                    <p class="text-xs text-slate-400">Sales Incharge</p>
                    <p id="salesIncharge" class="font-bold text-slate-700 text-lg">-</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm">
                    <p class="text-xs text-slate-400">Sale Support</p>
                    <p id="saleSupport" class="font-bold text-slate-700 text-lg">-</p>
                </div>
            </div>
        </div>

        <!-- Sub Info Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-3">
                <div class="p-2 bg-red-50 text-red-600 rounded-lg">📄</div>
                <div>
                    <p class="text-xs text-slate-400">Doc. Type</p>
                    <p id="docType" class="font-bold text-slate-700">-</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-3">
                <div class="p-2 bg-blue-50 text-blue-600 rounded-lg">📋</div>
                <div>
                    <p class="text-xs text-slate-400">Copies</p>
                    <p id="copies" class="font-bold text-slate-700">-</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-3">
                <div class="p-2 bg-emerald-50 text-emerald-600 rounded-lg">🔄</div>
                <div>
                    <p class="text-xs text-slate-400">Doc. Return</p>
                    <p id="docReturn" class="font-bold text-slate-700">-</p>
                </div>
            </div>
        </div>

        <!-- Details Boxes -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border-t-4 border-red-600">
                <div class="bg-red-50 px-4 py-2 font-bold text-red-600 text-sm">Invoice Conditions</div>
                <div id="invoiceConditions" class="p-4 text-slate-600 text-sm min-h-[100px]">-</div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border-t-4 border-indigo-900">
                <div class="bg-indigo-50 px-4 py-2 font-bold text-indigo-900 text-sm">Document Attached</div>
                <div id="documentAttached" class="p-4 text-slate-600 text-sm min-h-[100px]">-</div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border-t-4 border-purple-600">
                <div class="bg-purple-50 px-4 py-2 font-bold text-purple-600 text-sm">Remark</div>
                <div id="remark" class="p-4 text-slate-600 text-sm min-h-[100px]">-</div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border-t-4 border-emerald-600">
                <div class="bg-emerald-50 px-4 py-2 font-bold text-emerald-600 text-sm">Billing PO</div>
                <div id="billingPo" class="p-4 text-slate-600 text-sm min-h-[100px]">-</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tnellcczognzzjkwtsbf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZWxsY3pvZ256empla3dzYmYiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc2MjE5MTg1NiwiZXhwIjoyMDc3NzY3ODU2fQ.wH-XNq-_';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.handleSearch = async function() {
            let code = document.getElementById('searchInput').value.trim();
            if (!code) {
                alert('กรุณากรอกรหัสลูกค้า');
                return;
            }

            code = code.toUpperCase();

            const { data, error } = await sbClient
                .from('invoice_conditions')
                .select('*')
                .eq('customer_code', code)
                .maybeSingle();

            if (error) {
                console.error('Database Error:', error.message);
                alert('เกิดข้อผิดพลาดในการดึงข้อมูล');
                return;
            }

            if (!data) {
                alert('ไม่พบข้อมูลรหัสลูกค้านี้');
                return;
            }

            document.getElementById('customerName').innerText = data.customer_name || '-';
            document.getElementById('displayCode').innerText = data.customer_code || '-';
            document.getElementById('salesIncharge').innerText = data.sales_incharge || '-';
            document.getElementById('saleSupport').innerText = data.sale_support || '-';
            document.getElementById('docType').innerText = data.doc_type || '-';
            document.getElementById('copies').innerText = data.copies || '-';
            document.getElementById('docReturn').innerText = data.doc_return || '-';
            document.getElementById('invoiceConditions').innerText = data.invoice_conditions || '-';
            document.getElementById('documentAttached').innerText = data.document_attached || '-';
            document.getElementById('remark').innerText = data.remark || '-';
            document.getElementById('billingPo').innerText = data.billing_po || '-';
        }
    </script>
</body>
</html>
